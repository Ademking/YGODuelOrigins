  <style>
    html, body { margin: 0; height: 100%; background: #06050d; }
    #startup-status { position: fixed; inset: 42% 18% auto; z-index: 120; color: #f1ebdc; background: #14121f; padding: 20px; border-radius: 16px; text-align: center; font: 16px/1.5 system-ui, sans-serif; }
    #app:empty::after { content: ''; position: fixed; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px; border: 3px solid #d8b25e33; border-top-color: #d8b25e; border-radius: 50%; animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="startup-status" role="alert" hidden></div>
  <script type="module">
    const status = document.getElementById('startup-status');
    let ready = false;
    const fail = () => {
      if (ready) return;
      status.hidden = false;
      status.textContent = 'The game could not start. Reload the page to retry. If the problem persists, update your browser or close other tabs.';
    };
    const startupFailed = () => { if (!ready) fail(); };
    const timeout = setTimeout(startupFailed, 18000);
    document.addEventListener('duel-origins:ready', () => {
      ready = true;
      clearTimeout(timeout);
      status.hidden = true;
    }, { once: true });
    document.addEventListener('duel-origins:boot-error', startupFailed, { once: true });
    import('/src/main.ts').catch(startupFailed);
  </script>
</body>
